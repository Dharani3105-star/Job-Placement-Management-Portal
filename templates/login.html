<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Job & Placement Portal</h1>
    <p>Student Login</p>
</header>

<main>

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <p>Login to access job opportunities</p>

        <form method="POST">

            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</main>

</body>
</html>
